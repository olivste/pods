services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/run/secrets/google-service-account.json}
      GOOGLE_SHEETS_SPREADSHEET_ID: ${GOOGLE_SHEETS_SPREADSHEET_ID}
      GOOGLE_SHEETS_APPLICATION_NAME: ${GOOGLE_SHEETS_APPLICATION_NAME:-Pods Inventory}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      GOOGLE_SHEETS_PRODUCTS_SHEET: ${GOOGLE_SHEETS_PRODUCTS_SHEET:-Produtos}
      GOOGLE_SHEETS_SALES_SHEET: ${GOOGLE_SHEETS_SALES_SHEET:-Vendas}
      GOOGLE_SHEETS_MOVEMENTS_SHEET: ${GOOGLE_SHEETS_MOVEMENTS_SHEET:-Movimentacoes}
    volumes:
      - ${GOOGLE_CREDENTIALS_HOST_FILE:-./secrets/google-service-account.json}:/run/secrets/google-service-account.json:ro

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8080}
    ports:
      - "3000:80"
    depends_on:
      - backend
